interface:
  display_name: "需求开发"
  short_description: "默认复用 codex/dev 逐项本地提交，获准后 squash 汇总到 main 并推送"
  default_prompt: "使用 $requirement-dev，根据需求文档或问题清单开发，确认范围后默认复用已有 codex/dev 及其可用工作目录，分支不存在才创建，逐需求验证并以中文 Conventional Commits 本地提交；明确授权推送后，将本次全部改动 squash 为一条适度概括主要成果的 Conventional Commit，仅推送 main 并本地归档开发分支。"
